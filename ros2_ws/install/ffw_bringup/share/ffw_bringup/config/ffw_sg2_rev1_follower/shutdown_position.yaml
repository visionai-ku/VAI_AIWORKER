/**:
  arm_l_joint_trajectory_executor:
    ros__parameters:
      joint_names:
        - arm_l_joint1
        - arm_l_joint2
        - arm_l_joint3
        - arm_l_joint4
        - arm_l_joint5
        - arm_l_joint6
        - arm_l_joint7
        - gripper_l_joint1
      step_names: [step1, step2, step3, step4]
      #         j1    j2    j3     j4     j5   j6   j7   grip
      step1: [ 0.3,  0.0,  0.0,  -1.8,   0.0, 0.0, 0.0, 0.0]
      step2: [ 0.3,  0.0,  1.5,  -1.8,   0.0, 0.0, 0.0, 0.0]
      step3: [ 0.3,  0.0,  1.5,  -0.45,  0.2, 0.0, 0.0, 0.0]
      step4: [ 0.2,  0.0,  0.0,   0.0,   0.0, 0.2, 0.0, 0.0]
      duration: 5.0
      position_tolerance: 0.1
      velocity_tolerance: 0.01
      action_topic: '/arm_l_controller/follow_joint_trajectory'
      joint_states_topic: '/joint_states'

/**:
  arm_r_joint_trajectory_executor:
    ros__parameters:
      joint_names:
        - arm_r_joint1
        - arm_r_joint2
        - arm_r_joint3
        - arm_r_joint4
        - arm_r_joint5
        - arm_r_joint6
        - arm_r_joint7
        - gripper_r_joint1
      step_names: [step1, step2, step3, step4]
      # j3 is the only entry whose sign differs from the left arm.
      #         j1    j2    j3     j4     j5   j6   j7   grip
      step1: [ 0.3,  0.0,  0.0,  -1.8,   0.0, 0.0, 0.0, 0.0]
      step2: [ 0.3,  0.0, -1.5,  -1.8,   0.0, 0.0, 0.0, 0.0]
      step3: [ 0.3,  0.0, -1.5,  -0.45,  0.2, 0.0, 0.0, 0.0]
      step4: [ 0.2,  0.0,  0.0,   0.0,   0.0, 0.2, 0.0, 0.0]
      duration: 5.0
      position_tolerance: 0.1
      velocity_tolerance: 0.01
      action_topic: '/arm_r_controller/follow_joint_trajectory'
      joint_states_topic: '/joint_states'