[build-system]
requires = ["setuptools>=68","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ri_motion_v5_package"
version = "0.1.0"
description = "RILAB internal robotics package"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = [
    "ri_motion_v5_package",
    "ri_motion_v5_package.dpp",
    "ri_motion_v5_package.gaussian_process",
    "ri_motion_v5_package.hf_models",
    "ri_motion_v5_package.init_scripts",
    "ri_motion_v5_package.kinematics",
    "ri_motion_v5_package.leap2",
    "ri_motion_v5_package.llm_clients",
    "ri_motion_v5_package.mocap",
    "ri_motion_v5_package.motion_retarget",
    "ri_motion_v5_package.mujoco_sim",
    "ri_motion_v5_package.mujoco_sim.so",
    "ri_motion_v5_package.qt",
    "ri_motion_v5_package.traj_optimization",
    "ri_motion_v5_package.utility",
    "ri_motion_v5_package.vader5",
]

[tool.setuptools.package-dir]
"ri_motion_v5_package"                   = "."
"ri_motion_v5_package.dpp"               = "dpp"
"ri_motion_v5_package.gaussian_process"  = "gaussian_process"
"ri_motion_v5_package.hf_models"         = "hf_models"
"ri_motion_v5_package.init_scripts"      = "init_scripts"
"ri_motion_v5_package.kinematics"        = "kinematics"
"ri_motion_v5_package.leap2"             = "leap2"
"ri_motion_v5_package.llm_clients"       = "llm_clients"
"ri_motion_v5_package.mocap"             = "mocap"
"ri_motion_v5_package.motion_retarget"   = "motion_retarget"
"ri_motion_v5_package.mujoco_sim"        = "mujoco_sim"
"ri_motion_v5_package.mujoco_sim.so"     = "mujoco_sim/so"
"ri_motion_v5_package.qt"                = "qt"
"ri_motion_v5_package.traj_optimization" = "traj_optimization"
"ri_motion_v5_package.utility"           = "utility"
"ri_motion_v5_package.vader5"            = "vader5"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
